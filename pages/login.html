<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Login Admin</title>

  <!-- CSS -->
  <link rel="stylesheet"
    href="../assets/css/login.css">

</head>

<body>

  <!-- ================= LOGIN ================= -->

  <main class="login">
    <a href="../index.html" class="back-store">
      ← Voltar para loja
    </a>

    <div class="login-container">

      <h1>Login Admin</h1>

      <form class="login-form">

        <input
          type="email"
          name="email"
          placeholder="Seu email"
          required
        >

        <input
          type="password"
          name="password"
          placeholder="Sua senha"
          required
        >

        <button type="submit">
          Entrar
        </button>

      </form>

    </div>

  </main>

  <!-- JS -->
  <script
    type="module"
    src="../assets/js/login.js"
  ></script>

</body>

</html>
